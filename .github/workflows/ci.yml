name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Lint, Test and Sonar Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Importante para que SonarCloud analice el historial

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install -r requirements.txt

      - name: Run Linting (Ruff)
        run: ruff check .

      - name: Run Tests with Coverage
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/test_api_health.py tests/test_spark_stream.py --doctest-modules --junitxml=junit.xml --cov=. --cov-report=xml
        # Nota: He excluido test_cassandra y test_dashboard porque requieren la DB real levantada.
        # En una fase posterior podríamos usar Docker en CI para incluirlos.

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
