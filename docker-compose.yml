x-logging: &default-logging
  options:
    max-size: 10m
    max-file: "3"

services:
  broker:
    image: confluentinc/cp-server:7.9.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      CONFLUENT_METRICS_ENABLE: 'false'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
    logging: *default-logging
    networks:
      - confluent
    healthcheck:
      test: ['CMD', 'bash', '-c', 'nc -z localhost 9092']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    hostname: kafka-ui
    container_name: kafka-ui
    ports:
      - "8000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      broker:
        condition: service_healthy
    logging: *default-logging
    networks:
      - confluent

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    hostname: kafka-exporter
    container_name: kafka-exporter
    command:
      - '--kafka.server=broker:29092'
    ports:
      - "9308:9308"
    depends_on:
      broker:
        condition: service_healthy
    logging: *default-logging
    networks:
      - confluent

  prometheus:
    image: prom/prometheus:v3.13.2
    hostname: prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    logging: *default-logging
    networks:
      - confluent

  grafana:
    image: grafana/grafana:13.0.6
    hostname: grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana_datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ./grafana/dashboards-provider.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - confluent

  webserver:
    image: apache/airflow:3.1.7-python3.12
    command: webserver
    entrypoint: ['/opt/airflow/scripts/entrypoint.sh']
    depends_on:
      - postgres
    environment:
      - LOAD_EX=n
      - EXECUTOR=Sequential
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=this_is_a_very_secured_key
      - AIRFLOW__API__SECRET_KEY=this_is_a_very_secured_key
      - AIRFLOW__API_AUTH__JWT_SECRET=this_is_a_very_secured_key
    logging: *default-logging
    volumes:
      - ./dags:/opt/airflow/dags
      - ./script/entrypoint.sh:/opt/airflow/scripts/entrypoint.sh
      - ./requirements-airflow.txt:/opt/airflow/requirements-airflow.txt
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    networks:
      - confluent

  scheduler:
    image: apache/airflow:3.1.7-python3.12
    hostname: scheduler
    container_name: scheduler
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements-airflow.txt:/opt/airflow/requirements-airflow.txt
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - LOAD_EX=n
      - EXECUTOR=Sequential
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://webserver:8080/execution/
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=this_is_a_very_secured_key
      - AIRFLOW__API__SECRET_KEY=this_is_a_very_secured_key
      - AIRFLOW__API_AUTH__JWT_SECRET=this_is_a_very_secured_key
    command: bash -c "pip install -r ./requirements-airflow.txt && airflow db migrate && airflow scheduler"
    logging: *default-logging
    ports:
      - "8793:8793"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname scheduler"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - confluent

  dag-processor:
    image: apache/airflow:3.1.7-python3.12
    hostname: dag-processor
    container_name: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements-airflow.txt:/opt/airflow/requirements-airflow.txt
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - LOAD_EX=n
      - EXECUTOR=Sequential
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=this_is_a_very_secured_key
      - AIRFLOW__API__SECRET_KEY=this_is_a_very_secured_key
      - AIRFLOW__API_AUTH__JWT_SECRET=this_is_a_very_secured_key
    command: bash -c "pip install -r ./requirements-airflow.txt && airflow dag-processor"
    logging: *default-logging
    networks:
      - confluent

  postgres:
    image: postgres:18.3
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    logging: *default-logging
    networks:
      - confluent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile-spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9091:8080"
      - "7077:7077"
    logging: *default-logging
    networks:
      - confluent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile-spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      SPARK_MASTER_URL: spark://spark-master:7077
    logging: *default-logging
    networks:
      - confluent

  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile-spark
    hostname: spark-streaming
    container_name: spark-streaming
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.2,org.apache.spark:spark-token-provider-kafka-0-10_2.13:4.0.2,com.datastax.spark:spark-cassandra-connector_2.13:3.5.1
      --conf spark.jars.ivy=/home/spark/.ivy2
      /opt/spark/jobs/spark_stream.py
    environment:
      KAFKA_HOST: broker:29092
      CASSANDRA_HOST: cassandra
      SPARK_MASTER_URL: spark://spark-master:7077
      CHECKPOINT_DIR: /tmp/checkpoint
    volumes:
      - ./spark_stream.py:/opt/spark/jobs/spark_stream.py
      - spark_checkpoints:/tmp/checkpoint
    depends_on:
      broker:
        condition: service_healthy
      cassandra_db:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    restart: on-failure
    logging: *default-logging
    networks:
      - confluent

  cassandra_db:
    image: cassandra:5.0
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      - CASSANDRA_USERNAME=cassandra
      - CASSANDRA_PASSWORD=cassandra
    volumes:
      - cassandra_data:/var/lib/cassandra
    logging: *default-logging
    networks:
      - confluent
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  confluent:

volumes:
  cassandra_data:
  spark_checkpoints:
